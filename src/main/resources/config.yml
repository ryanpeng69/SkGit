credentials_path: "plugins/SkGit/credentials.yml"
log:
  # Whether to log actions such as commit, push, add, rm, etc.
  actions: true
send_error:
  console: true
  ops: true
send_warning:
  console: true
  ops: true
  warnings:
    # File could not be found (`credentials.yml`, `git add`, and `git remove`
    file_missing: true
    # Credentials is invalid (name and password are empty)
    credentials: true